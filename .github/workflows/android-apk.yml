name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir www
          cp index.html styles.css app.js data-model.js storage.js sync.js manifest.json service-worker.js icon.svg icon-maskable.svg styles-overrides.css native-plugins-entry.js www/
          npx esbuild native-plugins-entry.js --bundle --format=iife --outfile=www/native-plugins.js

      - name: Add Android project
        run: npx cap add android

      - name: Apply app icon
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26
          cp android-resources/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp android-resources/drawable/ic_launcher.xml android/app/src/main/res/drawable/ic_launcher.xml
          cp android-resources/mipmap-anydpi/ic_launcher.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp android-resources/mipmap-anydpi/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          cp android-resources/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-resources/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          sed -i -e 's|@mipmap/ic_launcher_round|@drawable/ic_launcher|g' -e 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: our-plan-space-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
